[project]
name = "p01-tip-calculator"
version = "0.1.0"
requires-python = ">=3.14.3"

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = True
warn_return_any = True
disallow_untyped_defs = True
